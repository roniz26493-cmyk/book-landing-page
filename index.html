<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F5D5A" />
    <!-- תמיד ערכה בהירה — גם כשמצב כהה מופעל במערכת או בדפדפן -->
    <meta name="color-scheme" content="light only" />

    <!-- ===================================================================
         SEO — כרגע ממולא בפרטים האמיתיים של "סיפור אחד ביום" מאת רועי סלע.
         שימו לב: התגיות כאן הן המקור לזחלני חיפוש ורשתות חברתיות,
         ולכן הן סטטיות ולא נלקחות מ-src/data/bookConfig.ts.
         אם שם הספר/המחבר ישתנו — לעדכן גם כאן וגם בקובץ הקונפיג.
    =================================================================== -->
    <title>סיפור אחד ביום — רועי סלע | עמוד הספר</title>
    <meta
      name="description"
      content="סיפור אחד ביום מאת רועי סלע: מסע ספרותי בשלושה חלקים — ילדות, התבגרות ובגרות — בשילוב סיפורים קצרים וקטעי שירה."
    />
    <link rel="canonical" href="https://www.roy-sela-author.co.il/" />

    <!-- Open Graph — תצוגת הקישור בוואטסאפ ובפייסבוק.
         התמונה: public/og-image.jpg (1200×630, סטטית). כתובות מלאות (https) — דרישה של הזחלנים.
         כשמחליפים תמונה — לתת לה שם קובץ חדש, כדי לעקוף את המטמון של וואטסאפ. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="סיפור אחד ביום" />
    <meta property="og:title" content="סיפור אחד ביום | רועי סלע" />
    <meta property="og:description" content="סיפורים קצרים על הרגעים שמהם החיים מורכבים." />
    <meta property="og:url" content="https://www.roy-sela-author.co.il/" />
    <meta property="og:image" content="https://www.roy-sela-author.co.il/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://www.roy-sela-author.co.il/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="הספר סיפור אחד ביום מאת רועי סלע" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="סיפור אחד ביום | רועי סלע" />
    <meta name="twitter:description" content="סיפורים קצרים על הרגעים שמהם החיים מורכבים." />
    <meta name="twitter:image" content="https://www.roy-sela-author.co.il/og-image.jpg" />
    <meta name="twitter:image:alt" content="הספר סיפור אחד ביום מאת רועי סלע" />

    <!-- Favicon placeholder — להחליף בלוגו/אייקון של הספר -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- הגופנים (Heebo, גברת לוין) מאוחסנים מקומית ונטענים מ-src/main.tsx -->
    <!-- כותרת ההירו: Comix No2 CLM Medium (© 2004 Maxim Iorsh, GPL v2 — /fonts/comix-no2-clm/).
         נטען מראש כדי שהכותרת לא תתחלף מול העיניים -->
    <link rel="preload" href="/fonts/comix-no2-clm/comixno2clm_medium-webfont.woff" as="font" type="font/woff" crossorigin />

    <!-- נתונים מובנים לספר (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Book",
        "name": "סיפור אחד ביום",
        "author": { "@type": "Person", "name": "רועי סלע" },
        "inLanguage": "he",
        "genre": "סיפורים קצרים ושירה",
        "image": "/og-cover.jpg",
        "description": "מסע ספרותי בשלושה חלקים — ילדות, התבגרות ובגרות — בשילוב סיפורים קצרים וקטעי שירה."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
