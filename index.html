<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F5D5A" />
    <!-- תמיד ערכה בהירה — גם כשמצב כהה מופעל במערכת או בדפדפן -->
    <meta name="color-scheme" content="light only" />

    <!-- ===================================================================
         SEO — כרגע ממולא בפרטים האמיתיים של "סיפור אחד ביום" מאת רועי סלע.
         שימו לב: התגיות כאן הן המקור לזחלני חיפוש ורשתות חברתיות,
         ולכן הן סטטיות ולא נלקחות מ-src/data/bookConfig.ts.
         אם שם הספר/המחבר ישתנו — לעדכן גם כאן וגם בקובץ הקונפיג.
    =================================================================== -->
    <title>סיפור אחד ביום — רועי סלע | עמוד הספר</title>
    <meta
      name="description"
      content="סיפור אחד ביום מאת רועי סלע: מסע ספרותי בשלושה חלקים — ילדות, התבגרות ובגרות — בשילוב סיפורים קצרים וקטעי שירה."
    />
    <link rel="canonical" href="https://example.com/" />
    <!-- TODO: להחליף ב-domain האמיתי -->

    <!-- Open Graph -->
    <meta property="og:type" content="book" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="סיפור אחד ביום" />
    <meta property="og:title" content="סיפור אחד ביום — רועי סלע" />
    <meta
      property="og:description"
      content="מסע ספרותי בשלושה חלקים — ילדות, התבגרות ובגרות — בשילוב סיפורים קצרים וקטעי שירה."
    />
    <meta property="og:url" content="https://example.com/" />
    <!-- TODO: להחליף ב-domain האמיתי כשיהיה ידוע -->
    <meta property="og:image" content="/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="סיפור אחד ביום — רועי סלע" />
    <meta
      name="twitter:description"
      content="מסע ספרותי בשלושה חלקים — ילדות, התבגרות ובגרות — בשילוב סיפורים קצרים וקטעי שירה."
    />
    <meta name="twitter:image" content="/og-cover.jpg" />

    <!-- Favicon placeholder — להחליף בלוגו/אייקון של הספר -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- הגופנים (Heebo, גברת לוין) מאוחסנים מקומית ונטענים מ-src/main.tsx -->

    <!-- נתונים מובנים לספר (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Book",
        "name": "סיפור אחד ביום",
        "author": { "@type": "Person", "name": "רועי סלע" },
        "inLanguage": "he",
        "genre": "סיפורים קצרים ושירה",
        "image": "/og-cover.jpg",
        "description": "מסע ספרותי בשלושה חלקים — ילדות, התבגרות ובגרות — בשילוב סיפורים קצרים וקטעי שירה."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
